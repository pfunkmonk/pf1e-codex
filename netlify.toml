[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# ---- Public read-only JSON API (api/, generated by tools/gen-api.mjs) -------------------------
# Static files on the CDN, so the same data the site already serves is simply addressable.
# CORS is open because this is public, read-only data: it lets the Compendium, the character
# generator and any other browser app pull from it. A few minutes of caching keeps repeat pulls
# cheap while a new data release still shows up quickly.
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"

# /api/v1 and /api/v1/ have no index file of their own; send them to the manifest.
[[redirects]]
  from = "/api/v1"
  to = "/api/v1/index.json"
  status = 200

[[redirects]]
  from = "/api/v1/"
  to = "/api/v1/index.json"
  status = 200
